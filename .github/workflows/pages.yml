name: Deploy static demo to GitHub Pages

# 把仓库里的 dist/（export_static.py 产出的纯静态只读站）发布到 GitHub Pages。
# 启用方式：仓库 Settings → Pages → Source 选 “GitHub Actions”。
# 之后每次 push 到 main 都会自动重新发布。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dist/ as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
